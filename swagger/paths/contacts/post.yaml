tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact's name
            example: Amalia Nikols
          phoneNumber:
            type: string
            description: Contact's number
            example: +380000001999
          email:
            type: string
            description: Contact's email
            example: amalia@example.com
          isFavourite:
            type: boolean
            description: Indicates whether the contact is marked as favorite
            example: true
          contactType:
            type: string
            description: Type of contact
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: Contact's photo
            type: string
            format: binary
responses:
  '201':
    description: Created a contact
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
