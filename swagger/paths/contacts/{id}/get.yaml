tags:
  - Contacts
summary: Get contact by id
operationId: getContact
description: Get contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 67eec4c00c73bfc979baedbc
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's name
            example: Amalia Nikols
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+380000001999'
          email:
            type: string
            format: email
            description: Contact's email
            example: amalia@example.com
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: personal
          photo:
            type: string
            format: binary
            description: Avatar image file
responses:
  '200':
    description: Get contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
