tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 67eec4c00c73bfc979baedbc
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Contact's name
            example: Amalia Nikols
          phoneNumber:
            type: string
            description: Contact's phone number
            example: '+380000001999'
          email:
            type: string
            format: email
            description: Contact's email
            example: amalia@example.com
          isFavourite:
            type: boolean
            description: Indicates whether the contact is marked as favorite
            example: true
          contactType:
            type: string
            enum: [work, home, personal]
            description: Type of contact
            example: personal
          photo:
            type: string
            format: binary
            description: Avatar image file
responses:
  '200':
    description: Update contact by id
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/Contact.yaml
  '400':
    description: Invalid input data
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid contact data
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
